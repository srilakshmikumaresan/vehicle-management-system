server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: vehicle-management-system
  datasource:
    url: jdbc:mysql://localhost:3306/vms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: always

jwt:
  secret: 9a2f8c4e7b1d3f6a8e0c2b5d7e9f1a4b6c8d0e2f4a6b8c0d2e4f6a8b0c2d4e6f
  expiration-ms: 86400000 # 24 Hours
